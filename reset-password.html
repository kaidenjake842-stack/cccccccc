<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | Asset Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    :root{--bg:#071018;--card:#101d2a;--text:#f5f8fb;--muted:#91a2b4;--line:rgba(255,255,255,.08);--primary:#53d6ff;--primary2:#7768ff}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,rgba(83,214,255,.12),transparent 30%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;padding:20px}
    .card{width:min(460px,100%);background:var(--card);border:1px solid var(--line);padding:30px;border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
    .logo{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:800;margin-bottom:22px}
    h1{margin:0 0 8px;font-size:32px;letter-spacing:-.04em} p{color:var(--muted);line-height:1.6;font-size:13px}
    label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:700;margin-top:16px}
    input{height:48px;border-radius:11px;border:1px solid var(--line);background:#0b1621;color:white;padding:0 13px;outline:0}
    input:focus{border-color:var(--primary)}
    button{width:100%;height:48px;border:0;border-radius:12px;margin-top:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-weight:800;cursor:pointer}
    #message{min-height:20px;margin-top:15px}
    a{color:var(--primary);text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">A</div>
    <h1>Reset password</h1>
    <p>Choose a new password for your Asset Hub account.</p>
    <form id="form">
      <label>New password<input id="password" type="password" minlength="8" required></label>
      <label>Confirm password<input id="confirm" type="password" minlength="8" required></label>
      <button type="submit">Update Password</button>
    </form>
    <p id="message"></p>
    <p><a href="./index.html">← Back to Asset Hub</a></p>
  </main>
  <script>
    const API_HOST =
      location.hostname === "127.0.0.1" ? "127.0.0.1" : "localhost";
    const API_URL = `https://cccccccc-fo54.onrender.com`;
    const token = new URLSearchParams(location.search).get("token");
    const form = document.getElementById("form");
    const message = document.getElementById("message");

    if (!token) {
      message.textContent = "This reset link is invalid.";
      form.style.display = "none";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/auth/reset-password`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ token, password })
        });

        const data = await response.json();
        message.textContent = data.message || data.error || "Done.";

        if (response.ok) {
          form.reset();
          setTimeout(() => location.href = "./index.html", 1500);
        }
      } catch {
        message.textContent = "Could not connect to the Asset Hub backend.";
      }
    });
  </script>
</body>
</html>
